name: Lint, Test, and Build

# `aos4-migration` is the long-lived integration branch for the AoS 4 migration (see AGENTS.md).
# Without it here, migration sub-PRs merge with no lint/test/build gate at all.
on:
  push:
    branches: [ master, aos4-migration ]
  pull_request:
    branches: [ master, aos4-migration ]

env:
  CI: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies with yarn
        run: yarn install --frozen-lockfile

      - name: Lint with eslint
        run: yarn lint

      - name: Test with vitest
        run: yarn test --run

      - name: Validate AoS 4 beta data readiness
        run: yarn data:aos4:verify:beta

      - name: Build with TypeScript
        run: yarn build
