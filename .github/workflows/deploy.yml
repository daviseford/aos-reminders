name: Deployment

# from https://github.com/linuxacademy/content-github-actions-deep-dive-lab/blob/solution/%20.github/workflows/production.yaml

# This workflow publishes to production (S3 + CloudFront). Keep the trigger list to `master` only.
#
# In particular, do NOT add `workflow_run` on "Lint, Test, and Build", and do NOT add any
# integration branch here. Lint/test/build coverage for those branches belongs in nodejs.yml,
# which holds no credentials and ships nothing.
on:
  push:
    branches:
      - master


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_S3: s3://aosreminders.com
      SITE_BUILD_DIR: ./dist
      CF_DIST_ID: E3OO9Y9QRVZ2L1
      VITE_ARMY_API_URL: ${{ vars.PRODUCTION_ARMY_API_URL }}
      VITE_SUBSCRIPTION_API_URL: ${{ vars.PRODUCTION_SUBSCRIPTION_API_URL }}
      # Header classes. Hashed assets never change under a given name; the entry
      # points must be revalidated on every request or an installed service
      # worker can be pinned to an old build at the edge. Keep these in step with
      # upload.sh and CI-build.sh; see docs/deployment.md.
      IMMUTABLE: 'public, max-age=31536000, immutable'
      MODERATE: 'public, max-age=86400'
      REVALIDATE: 'public, max-age=0, must-revalidate'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies with yarn
        run: yarn install --frozen-lockfile

      - name: Validate production API configuration
        run: yarn release:validate-config

      - name: Lint with eslint
        run: yarn lint

      - name: Validate AoS 4 beta data readiness
        run: yarn data:aos4:verify:beta

      - name: Check TypeScript
        run: yarn tsc --noEmit

      - name: Build production artifact
        run: yarn build

      # The build-shape assertions in src/tests/pwaBuild.test.ts are the only thing that
      # catches a PWA config regression that stops emitting the worker. Without this step
      # they live only in nodejs.yml, which does not gate the deploy.
      - name: Test with vitest
        run: yarn test --run

      - name: Inspect production artifact
        run: yarn release:inspect-artifact

      - name: Configure AWS cli
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Hashed assets first: a freshly revalidated index.html must never
      # reference a chunk that has not landed yet.
      #
      # `cp`, not `sync`. sync skips objects whose size and mtime match, which
      # would leave a still-referenced chunk's LastModified frozen at its first
      # upload -- and the bucket lifecycle rule expires by age, so it would
      # eventually delete a chunk the live index.html still points at. Uploading
      # unconditionally refreshes exactly this build's asset set and nothing
      # else; refreshing the whole remote prefix instead would also revive
      # long-dead orphans and stop the lifecycle rule ever collecting anything.
      - name: Upload content-hashed assets
        run: aws s3 cp "${{ env.SITE_BUILD_DIR }}/assets" "${{ env.SITE_S3 }}/assets" --recursive --cache-control "${{ env.IMMUTABLE }}"

      # Unhashed public assets carry a ?v= query buster rather than a content
      # hash, so a moderate TTL and no `immutable`.
      - name: Upload unhashed public assets
        run: |
          aws s3 sync "${{ env.SITE_BUILD_DIR }}" "${{ env.SITE_S3 }}" \
            --exclude "*build_log.txt" --exclude "*.idea*" --exclude "*.sh" \
            --exclude "*.git*" --exclude "*.DS_Store" \
            --exclude "assets/*" --exclude "index.html" --exclude "site.webmanifest" \
            --exclude "service-worker.js" --exclude "workbox-*.js" --exclude "registerSW.js" \
            --exclude "sw-extras.js" \
            --cache-control "${{ env.MODERATE }}"

      # The worker does `importScripts("sw-extras.js")` and precaches index.html by
      # revision, so both must be live before the worker that references them.
      # sw-extras.js carries this build's catalog URL and is mandatory; workbox-*.js
      # is a glob that may not expand and registerSW.js is never emitted under
      # injectRegister:false, so those two stay optional.
      - name: Upload manifest and worker dependencies
        run: |
          aws s3 cp "${{ env.SITE_BUILD_DIR }}/site.webmanifest" "${{ env.SITE_S3 }}/site.webmanifest" \
            --cache-control "${{ env.REVALIDATE }}" --content-type "application/manifest+json"
          aws s3 cp "${{ env.SITE_BUILD_DIR }}/sw-extras.js" "${{ env.SITE_S3 }}/sw-extras.js" \
            --cache-control "${{ env.REVALIDATE }}"
          for optional in "${{ env.SITE_BUILD_DIR }}"/workbox-*.js "${{ env.SITE_BUILD_DIR }}"/registerSW.js; do
            [ -e "$optional" ] || continue
            aws s3 cp "$optional" "${{ env.SITE_S3 }}/$(basename "$optional")" --cache-control "${{ env.REVALIDATE }}"
          done

      - name: Upload index.html
        run: aws s3 cp "${{ env.SITE_BUILD_DIR }}/index.html" "${{ env.SITE_S3 }}/index.html" --cache-control "${{ env.REVALIDATE }}" --content-type "text/html; charset=utf-8"

      # Last, and mandatory. A build that did not emit the worker is broken, not old:
      # skipping it would leave the previous worker controlling every client while the
      # deploy reports success.
      - name: Upload service worker
        run: |
          if [ ! -e "${{ env.SITE_BUILD_DIR }}/service-worker.js" ]; then
            echo "FATAL: service-worker.js missing -- refusing to deploy" >&2
            exit 1
          fi
          aws s3 cp "${{ env.SITE_BUILD_DIR }}/service-worker.js" "${{ env.SITE_S3 }}/service-worker.js" \
            --cache-control "${{ env.REVALIDATE }}"

      # Only the mutable entry points. `/*` is one billable path but evicts every
      # hashed asset from the edge, forcing a full refetch from S3.
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CF_DIST_ID }} --paths "/" "/index.html" "/site.webmanifest" "/service-worker.js" "/sw-extras.js"
