name: Deployment

# from https://github.com/linuxacademy/content-github-actions-deep-dive-lab/blob/solution/%20.github/workflows/production.yaml

# This workflow publishes to production (S3 + CloudFront). Keep the trigger list to `master` only.
#
# In particular, do NOT add `workflow_run` on "Lint, Test, and Build", and do NOT add any
# integration branch here. Lint/test/build coverage for those branches belongs in nodejs.yml,
# which holds no credentials and ships nothing.
on:
  push:
    branches:
      - master

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_S3: s3://aosreminders.com
      SITE_BUILD_DIR: ./dist
      CF_DIST_ID: E3OO9Y9QRVZ2L1
      VITE_ARMY_API_URL: ${{ vars.PRODUCTION_ARMY_API_URL }}
      VITE_SUBSCRIPTION_API_URL: ${{ vars.PRODUCTION_SUBSCRIPTION_API_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies with yarn
        run: yarn install --frozen-lockfile

      - name: Validate production API configuration
        run: yarn release:validate-config

      - name: Lint with eslint
        run: yarn lint

      - name: Validate AoS 4 beta data readiness
        run: yarn data:aos4:verify:beta

      - name: Check TypeScript
        run: yarn tsc --noEmit

      - name: Build production artifact
        run: yarn build

      # The build-shape assertions in src/tests/pwaBuild.test.ts are the only thing that
      # catches a PWA config regression that stops emitting the worker. Without this step
      # they live only in nodejs.yml, which does not gate the deploy.
      - name: Test with vitest
        run: yarn test --run

      - name: Inspect production artifact
        run: yarn release:inspect-artifact

      - name: Configure AWS cli
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Every AWS mutation lives in the shared contract used by the two manual
      # entry points as well. The S3 lock also serializes those external callers.
      - name: Publish production artifact
        env:
          DEPLOY_OWNER: github-actions:${{ github.repository_owner }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: bash scripts/deploy-production.sh
